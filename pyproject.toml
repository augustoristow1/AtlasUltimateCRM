[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-ultimate-crm"
version = "0.1.0"
description = "Atlas Ultimate CRM - Desktop-first CRM with WhatsApp integration"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.13.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "phonenumbers>=8.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
atlas-crm = "atlas_ultimate_crm.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_ultimate_crm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
